services:
  postgres:
    image: postgres:17
    container_name: digo-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: digo
      POSTGRES_PASSWORD: digo
      POSTGRES_DB: digo_academy
    ports:
      - '5432:5432'
    volumes:
      - digo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digo -d digo_academy']
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3-compatible object storage for dev. Production uses real AWS S3
  # (same code — just change the S3_* env vars).
  minio:
    image: minio/minio:latest
    container_name: digo-academy-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - digo-minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and allow browser uploads (CORS).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 2; done;
      mc mb --ignore-existing local/digo-academy;
      mc anonymous set download local/digo-academy;
      echo 'bucket ready';
      "

volumes:
  digo-pgdata:
  digo-minio:
